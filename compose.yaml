services:
  # Python CNSVS backend API (FastAPI)
  cnsvs-backend:
    build:
      context: ./backend
    image: cnsvs-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  cnsvs-analyzer:
    build:
      context: .
    image: cnsvs-analyzer
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Serve the CNSVS UI by default
      APP_ENTRY: index.html
    depends_on:
      - cnsvs-backend
    restart: unless-stopped
