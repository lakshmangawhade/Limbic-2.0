services:
  # Python pupilometry parser — Node proxies /api/pupilometry/parse here
  pupilometry-backend:
    build:
      context: ./backend
    image: pupilometry-backend
    expose:
      - "8000"
    restart: unless-stopped

  posturography-analyzer:
    build:
      context: .
    image: pupilometry-analyzer
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Inside Docker, 127.0.0.1 is this container — use the backend service name
      PUPILOMETRY_PARSE_URL: http://pupilometry-backend:8000/parse-pupilometry
    depends_on:
      - pupilometry-backend
    restart: unless-stopped
